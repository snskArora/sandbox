name: Dynamic Matrix Example

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Select the type of release bump'
        required: true
        type: 'choice'
        options:
          - patch
          - minor
          - major
          - rc
        default: rc
  pull_request:
    types: [closed]
    branches:
      - main
  push:

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    steps:
    # - name: checkout
    #   uses: actions/checkout@v4

